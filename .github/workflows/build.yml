name: Build Native and WebAssembly

on:
  push:
    branches:
      - main
      - ci/validate-native-wasm
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Linux C++20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake \
            libgles2-mesa-dev libegl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxext-dev libxfixes-dev libxkbcommon-dev
      - name: Configure
        run: cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/native --parallel 2

  wasm:
    name: WebAssembly WebGL2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.15'
      - name: Configure
        run: emcmake cmake -S . -B build/web -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/web --parallel 2
      - name: Verify artifacts
        run: |
          test -s build/web/boomer_shooter.html
          test -s build/web/boomer_shooter.wasm
          test -s build/web/boomer_shooter.js
      - name: Archive browser build
        uses: actions/upload-artifact@v4
        with:
          name: boomer-shooter-wasm
          path: |
            build/web/boomer_shooter.html
            build/web/boomer_shooter.js
            build/web/boomer_shooter.wasm
          retention-days: 7
